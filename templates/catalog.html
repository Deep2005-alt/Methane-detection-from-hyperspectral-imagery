{% extends "base.html" %}

{% block title %}Tile Catalog | Methane Detection AI{% endblock %}
{% block page_title %}Flightline Tile Explorer{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <div>
      <p class="text-slate-400 text-sm">Browse and analyze the complete set of generated hyperspectral tiles.</p>
    </div>
    <div class="flex items-center gap-3">
      <button id="filter-all" onclick="setFilter(false)" class="px-4 py-2 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">All Tiles</button>
      <button id="filter-plumes" onclick="setFilter(true)" class="px-4 py-2 rounded-xl text-xs font-medium bg-emerald-600 text-white transition shadow-lg shadow-emerald-900/20">Plumes Only</button>

      <div class="h-6 w-px bg-slate-800 mx-2"></div>

      <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer group">
        <input type="checkbox" id="toggle-annotations" checked onchange="renderTiles()" class="accent-emerald-500 w-4 h-4 rounded">
        <span class="group-hover:text-white transition">Overlay Ground Truth</span>
      </label>
    </div>
  </div>

  <div id="tile-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 min-h-[400px]">
    <!-- Rendered by JS -->
  </div>

  <div class="flex items-center justify-between pt-6 border-t border-slate-800 text-xs text-slate-500">
    <span id="page-info">Loading catalog...</span>
    <div class="flex gap-3">
      <button id="prev-btn" onclick="prevPage()" class="px-4 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 disabled:opacity-30 transition border border-slate-800">Previous</button>
      <button id="next-btn" onclick="nextPage()" class="px-4 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 disabled:opacity-30 transition border border-slate-800">Next</button>
    </div>
  </div>
</div>

<script>
  let currentPage = 1;
  let totalPages = 1;
  let plumesOnly = true;

  async function loadTiles(page = 1) {
    currentPage = page;
    const overlayOn = document.getElementById('toggle-annotations').checked;
    try {
      const res = await fetch(`/api/tiles?plumes_only=${plumesOnly}&page=${page}&limit=24`);
      const data = await res.json();
      totalPages = data.pages || 1;
      document.getElementById('page-info').innerText = `Viewing Page ${data.page} of ${totalPages} (${data.total} tiles discovered)`;
      document.getElementById('prev-btn').disabled = currentPage <= 1;
      document.getElementById('next-btn').disabled = currentPage >= totalPages;

      const grid = document.getElementById('tile-grid');
      grid.innerHTML = '';

      data.tiles.forEach(t => {
        const imgUrl = overlayOn && t.has_plume ? t.annotated_url : t.url;
        const card = document.createElement('div');
        card.className = `group relative bg-slate-900 border ${t.has_plume ? 'border-emerald-500/30' : 'border-slate-800'} rounded-2xl overflow-hidden p-2 cursor-pointer hover:border-emerald-400 transition-all hover:shadow-xl hover:shadow-emerald-900/10`;
        card.onclick = () => {
          window.location.href = `/detector?tile=${t.filename}`;
        };

        card.innerHTML = `
          <div class="aspect-square bg-slate-950 rounded-xl overflow-hidden flex items-center justify-center relative">
            <img src="${imgUrl}" alt="${t.filename}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
            ${t.has_plume ? '<span class="absolute top-2 right-2 bg-emerald-600/90 text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold backdrop-blur-sm">CH4</span>' : ''}
          </div>
          <div class="text-[10px] text-slate-500 mt-2 px-1 font-mono truncate">${t.filename}</div>
        `;
        grid.appendChild(card);
      });
    } catch (e) {
      console.error('Failed to load tiles:', e);
    }
  }

  function renderTiles() {
    loadTiles(currentPage);
  }

  function setFilter(onlyPlumes) {
    plumesOnly = onlyPlumes;
    document.getElementById('filter-all').className = onlyPlumes ?
      'px-4 py-2 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition' :
      'px-4 py-2 rounded-xl text-xs font-medium bg-emerald-600 text-white transition shadow-lg shadow-emerald-900/20';
    document.getElementById('filter-plumes').className = onlyPlumes ?
      'px-4 py-2 rounded-xl text-xs font-medium bg-emerald-600 text-white transition shadow-lg shadow-emerald-900/20' :
      'px-4 py-2 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition';
    loadTiles(1);
  }

  function prevPage() { if (currentPage > 1) loadTiles(currentPage - 1); }
  function nextPage() { if (currentPage < totalPages) loadTiles(currentPage + 1); }

  // Init
  loadTiles(1);
</script>
{% endblock %}
