<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Methane Detection AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .bg-mesh {
      background-color: #020617;
      background-image:
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(234, 179, 8, 0.15) 0px, transparent 50%);
    }
  </style>
</head>
<body class="bg-mesh text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-emerald-500/20 flex items-center justify-center border border-emerald-500/30 text-emerald-400 mx-auto mb-4">
        <i class="fa-solid fa-satellite text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Welcome Back</h1>
      <p class="text-slate-400">Secure access to the Methane Detection AI Server</p>
    </div>

    <div class="glass-panel rounded-3xl p-8 shadow-2xl">
      <form action="/login" method="POST" class="space-y-6">
        <div class="space-y-2">
          <label class="text-sm font-medium text-slate-300 block ml-1">Email Address</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input type="email" name="email" required
              class="w-full bg-slate-900/50 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition"
              placeholder="name@company.com">
          </div>
        </div>

        <div class="space-y-2">
          <div class="flex justify-between items-center ml-1">
            <label class="text-sm font-medium text-slate-300">Password</label>
            <a href="/forgot-password" class="text-xs text-emerald-400 hover:text-emerald-300 transition">Forgot?</a>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" name="password" required
              class="w-full bg-slate-900/50 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition"
              placeholder="••••••••">
          </div>
        </div>

        <button type="submit"
          class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl transition-all transform active:scale-[0.98] shadow-lg shadow-emerald-900/20 flex items-center justify-center gap-2">
          Sign In <i class="fa-solid fa-arrow-right text-sm"></i>
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-slate-700/50 text-center">
        <p class="text-sm text-slate-400">
          Don't have an account?
          <a href="/signup" class="text-emerald-400 font-semibold hover:text-emerald-300 transition">Create Account</a>
        </p>
      </div>
    </div>

    <footer class="mt-8 text-center text-xs text-slate-500">
      &copy; 2026 Methane Detection AI &bull; Secure Enterprise Portal
    </footer>
  </div>
</body>
</html>
