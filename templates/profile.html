{% extends "base.html" %}

{% block title %}User Settings | Methane Detection AI{% endblock %}
{% block page_title %}Account Settings{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-8">
    <div class="glass-card rounded-3xl p-8 space-y-6">
        <div class="flex items-center gap-3 mb-6">
            <div class="p-2 rounded-lg bg-emerald-500/20 text-emerald-400">
                <i class="fa-solid fa-user-gear text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Profile Configuration</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">Full Name</label>
                <input type="text" value="{{ user_name }}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition">
            </div>
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-widest">Email Address</label>
                <input type="email" value="analyst@h-mrcnn.ai" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition">
            </div>
        </div>

        <div class="pt-6 border-t border-slate-800 flex justify-end">
            <button class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all active:scale-95">
                Save Changes
            </button>
        </div>
    </div>

    <div class="glass-card rounded-3xl p-8 space-y-6">
        <div class="flex items-center gap-3 mb-6">
            <div class="p-2 rounded-lg bg-amber-500/20 text-amber-400">
                <i class="fa-solid fa-shield-halved text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Security</h2>
        </div>

        <div class="space-y-4">
            <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-900/40 border border-slate-800">
                <div>
                    <p class="text-sm font-bold text-white">Two-Factor Authentication</p>
                    <p class="text-xs text-slate-500">Add an extra layer of security to your account</p>
                </div>
                <div class="w-12 h-6 rounded-full bg-slate-700 relative cursor-pointer transition-colors hover:bg-slate-600">
                    <div class="absolute left-1 top-1 w-4 h-4 rounded-full bg-white transition-all"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
